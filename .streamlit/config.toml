[server]
# Hard cap on uploads (MB). This is a guard rail, NOT the real memory fix —
# the actual OOM driver for images is *resolution*, which is capped in code by
# MAX_RELIEF_DIM in core_engine.py, so a large image file is safe. 250 MB is
# needed for big scientific data files (HDF5/NetCDF/GRIB, e.g. GW datasets).
# maxMessageSize must be >= maxUploadSize or large uploads fail on the socket.
maxUploadSize = 250
maxMessageSize = 300
